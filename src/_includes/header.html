<header>
  <h1>
    <img src="/public/images/salty_feet_logo.png" width="200" class="logo" />
  </h1>

  <nav>
    <a class="{% if page.url == '/' %}active{% endif %}" href="/">HOME</a>
    <a class="{% if page.url == '/about' %}active{% endif %}" href="/about"
      >MEET THE CREW</a
    >
    <a
      class="{% if page.url == '/social-traveller' %}active{% endif %}"
      href="/social-traveller"
      >THE SOCIAL TRAVELLER</a
    >
    <a
      class="{% if page.url == '/free-traveller' %}active{% endif %}"
      href="/free-traveller"
      >THE FREE TRAVELLER</a
    >

    <a class="{% if page.url == '/gallery' %}active{% endif %}" href="/gallery"
      >GALLERY</a
    >
  </nav>

  <button class="mobile-menu-button">
    <svg
      width="32"
      height="32"
      viewBox="0 0 32 32"
      aria-label="Open menu"
      xmlns="http://www.w3.org/2000/svg"
      class="hamburger-menu"
      fill="none"
      stroke="currentColor"
      stroke-width="3"
      stroke-linecap="round"
    >
      <line x1="6" y1="9" x2="26" y2="9" />
      <line x1="6" y1="16" x2="26" y2="16" />
      <line x1="6" y1="23" x2="26" y2="23" />
    </svg>
  </button>
</header>
<div class="stickyHeader">
  <nav class="">
    <a class="{% if page.url == '/' %}active{% endif %}" href="/">HOME</a>
    <a class="{% if page.url == '/about' %}active{% endif %}" href="/about"
      >MEET THE CREW</a
    >
    <a
      class="{% if page.url == '/social-traveller' %}active{% endif %}"
      href="/social-traveller"
      >THE SOCIAL TRAVELLER</a
    >
    <a
      class="{% if page.url == '/free-traveller' %}active{% endif %}"
      href="/free-traveller"
      >THE FREE TRAVELLER</a
    >

    <a class="{% if page.url == '/gallery' %}active{% endif %}" href="/gallery"
      >GALLERY</a
    >
  </nav>
</div>

<button id="scrollUp">↑</button>

<script>
  document.querySelectorAll("nav a").forEach(function (link) {
    console.log(link.href, window.location.origin + window.location.pathname);
    if (link.href + "/" === window.location.origin + window.location.pathname) {
      link.classList.add("active");
    }
  });

  const header = document.querySelector("header");
  const scrollUpButton = document.getElementById("scrollUp");
  const stickyHeader = document.querySelector(".stickyHeader");
  if (header && "IntersectionObserver" in window) {
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) {
            stickyHeader.classList.add("sticky");
            scrollUpButton.classList.add("visible");
          } else {
            stickyHeader.classList.remove("sticky");
            scrollUpButton.classList.remove("visible");
          }
        });
      },
      { threshold: 0 }
    );
    observer.observe(header);
  }
</script>
